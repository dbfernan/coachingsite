    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        plum:'#3b1f6e',
                        'plum-mid':'#52308f',

                        'purple-lt':'#a97de0',

    <style>

        h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
        html { background: #3b1f6e; }
        body { background: #f8f7ff; }
        main { animation: fadeIn 0.5s ease both; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .skip-link {
            position: absolute; top: 1rem; left: -999px;
            background: #3b1f6e; color: #fff; padding: 0.4rem 0.8rem;
            text-decoration: none; border-radius: 6px; z-index: 100;
        }
        .skip-link:focus { left: 1rem; }
        input, textarea { font-family: 'Nunito', sans-serif; }
        input:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px #e8dcff;
            border-color: #7c4dbd;
        }

        .fade-up {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-up.is-visible { opacity: 1; transform: translateY(0); }
        @media (prefers-reduced-motion: reduce) {
            .fade-up { opacity: 1; transform: none; transition: none; }
        }
        .hover-lift {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(59, 31, 110, 0.18);
        }
        .eyebrow { letter-spacing: 0.14em; }
    </style>
</head>

    <!-- MAIN -->

                    </div>

            <!-- FORM -->

                <div class="bg-white border border-lilac rounded-2xl p-8 flex flex-col gap-5 shadow-sm">
                    <div>

                        <input type="email" id="email" placeholder="name@example.com"
                            class="w-full border border-lilac rounded-xl px-4 py-3 text-plum text-sm placeholder-plum/30 transition">
                    </div>
                    <div>
                        <label for="name" class="block text-xs font-bold uppercase tracking-widest text-purple mb-1.5">Name</label>
                        <input type="text" id="name" placeholder="Your Name"
                            class="w-full border border-lilac rounded-xl px-4 py-3 text-plum text-sm placeholder-plum/30 transition">
                    </div>
                    <div>
                        <p class="block text-xs font-bold uppercase tracking-widest text-purple mb-2">Goal</p>
                        <div class="flex flex-wrap gap-3">
                            <label class="flex-1 flex items-center gap-3 border-2 border-lilac rounded-xl px-4 py-3 cursor-pointer hover:border-purple transition has-[:checked]:border-purple has-[:checked]:bg-lilac">
                                <input type="radio" name="goal" value="fun" class="accent-purple shrink-0">
                                <span class="text-sm font-semibold text-plum">Fun-Focused</span>
                            </label>
                            <label class="flex-1 flex items-center gap-3 border-2 border-lilac rounded-xl px-4 py-3 cursor-pointer hover:border-purple transition has-[:checked]:border-purple has-[:checked]:bg-lilac">
                                <input type="radio" name="goal" value="competition" class="accent-purple shrink-0">
                                <span class="text-sm font-semibold text-plum">Competition-Focused</span>
                            </label>
                            <label class="flex-1 flex items-center gap-3 border-2 border-lilac rounded-xl px-4 py-3 cursor-pointer hover:border-purple transition has-[:checked]:border-purple has-[:checked]:bg-lilac">
                                <input type="radio" name="goal" value="mix" class="accent-purple shrink-0">
                                <span class="text-sm font-semibold text-plum">Mix of Both</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <p class="block text-xs font-bold uppercase tracking-widest text-purple mb-2">Level</p>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <label class="flex-1 flex items-center gap-3 border-2 border-lilac rounded-xl px-4 py-3 cursor-pointer hover:border-purple transition has-[:checked]:border-purple has-[:checked]:bg-lilac">
                                <input type="radio" name="level" value="beginner" class="accent-purple shrink-0">
                                <span class="text-sm font-semibold text-plum">Beginner</span>
                            </label>
                            <label class="flex-1 flex items-center gap-3 border-2 border-lilac rounded-xl px-4 py-3 cursor-pointer hover:border-purple transition has-[:checked]:border-purple has-[:checked]:bg-lilac">
                                <input type="radio" name="level" value="intermediate" class="accent-purple shrink-0">
                                <span class="text-sm font-semibold text-plum">Intermediate</span>
                            </label>
                            <label class="flex-1 flex items-center gap-3 border-2 border-lilac rounded-xl px-4 py-3 cursor-pointer hover:border-purple transition has-[:checked]:border-purple has-[:checked]:bg-lilac">
                                <input type="radio" name="level" value="advanced" class="accent-purple shrink-0">
                                <span class="text-sm font-semibold text-plum">Advanced</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label for="message" class="block text-xs font-bold uppercase tracking-widest text-purple mb-1.5">Message</label>
                        <textarea id="message" rows="4" placeholder="Your message..."
                            class="w-full border border-lilac rounded-xl px-4 py-3 text-plum text-sm placeholder-plum/30 resize-none transition"></textarea>
                    </div>
                    <button type="button" id="submit-btn"
                        class="w-full bg-purple text-white font-bold py-3 rounded-xl hover:bg-plum-mid transition text-sm">
                        Submit
                    </button>
                    <p id="form-error" class="hidden text-sm text-red-500 font-medium text-center"></p>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->

        <div class="max-w-5xl mx-auto px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-5">

                <p class="text-white font-bold text-sm">DF Tennis Coaching</p>
                <p class="text-white/40 text-xs mt-0.5">CNY · Syracuse, New York</p>
                <p class="text-white/40 text-xs mt-0.5">(315) 795-8823</p>

            <div class="flex gap-4 items-center">
                <a href="https://www.instagram.com/dbfernan06/" aria-label="Instagram" class="text-white/40 hover:text-lilac transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

                <a href="https://www.linkedin.com/in/dbfernan/" aria-label="LinkedIn" class="text-white/40 hover:text-lilac transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>

                <a href="mailto:dbfernan@syr.edu" aria-label="Email" class="text-white/40 hover:text-lilac transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </a>
            </div>
            <p class="text-white/40 text-xs">© 2026 David Fernando</p>
        </div>

    </footer>

    <script>
        document.getElementById('hamburger').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const email   = document.getElementById('email').value.trim();
            const name    = document.getElementById('name').value.trim();
            const goal    = document.querySelector('input[name="goal"]:checked')?.value || '';
            const level   = document.querySelector('input[name="level"]:checked')?.value || '';
            const message = document.getElementById('message').value.trim();
            const errorEl = document.getElementById('form-error');
            const btn     = document.getElementById('submit-btn');

            if (!email || !name || !message) {
                errorEl.textContent = 'Please fill in all fields before submitting.';
                errorEl.classList.remove('hidden');
                return;
            }
            errorEl.classList.add('hidden');
            btn.textContent = 'Sending…';
            btn.disabled = true;

            try {
                const res = await fetch('https://formspree.io/f/xvzjwdgo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email, name, goal, level, message }),
                });
                if (res.ok) {
                    btn.textContent = '✓ Message Sent!';
                    btn.classList.replace('bg-purple', 'bg-green-500');
                    btn.classList.replace('hover:bg-plum-mid', 'hover:bg-green-600');
                    ['email','name','message'].forEach(id => document.getElementById(id).value = '');
                    document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
                } else {
                    throw new Error();
                }
            } catch {
                errorEl.textContent = 'Something went wrong. Please try again or reach out directly.';
                errorEl.classList.remove('hidden');
                btn.textContent = 'Submit';
                btn.disabled = false;
            }
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    </script>
